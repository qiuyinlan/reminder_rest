name: Unit Test

on:
  push:
    branches: ['feature/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        id: test
        continue-on-error: true
        run: |
          gradle :app:testDebugUnitTest --tests 'io.iftech.healthreminder.TaskCategoryStorageTest' \
            --no-daemon --stacktrace 2>&1 | tee /tmp/test.log
          exit ${PIPESTATUS[0]}

      - name: Collect report
        if: always()
        run: |
          {
            echo "RESULT: ${{ steps.test.outcome }}"
            echo
            echo "== DIAG =="
            grep -a "DIAG" /tmp/test.log || true
            echo
            echo "== junit =="
            find app/build/test-results -name '*.xml' -exec cat {} \; 2>/dev/null | head -c 15000 || true
            echo
            echo "== log tail =="
            tail -c 12000 /tmp/test.log || true
          } > /tmp/report/unit-test-report.log 2>/dev/null || {
            mkdir -p /tmp/report
            tail -c 12000 /tmp/test.log > /tmp/report/unit-test-report.log
          }

      - name: Publish report branch
        if: always()
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q
          git config user.name github-actions
          git config user.email actions@github.com
          cp /tmp/report/unit-test-report.log .
          git add unit-test-report.log
          git commit -q -m "unit test report for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-report

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
