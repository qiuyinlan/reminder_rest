name: Unit Test

on:
  push:
    branches: ['feature/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        id: test
        continue-on-error: true
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/test.log
          exit ${PIPESTATUS[0]}

      - name: Publish report to ci-log
        if: always()
        run: |
          set -e
          {
            echo "RESULT: ${{ steps.test.outcome }}"
            echo
            echo "== DIAG =="
            grep -a "DIAG" /tmp/test.log || true
            echo
            echo "== junit =="
            find app/build/test-results -name '*.xml' -exec cat {} \; 2>/dev/null | head -c 15000 || true
            echo
            echo "== log tail =="
            tail -c 15000 /tmp/test.log || true
          } > unit-test-report.log || true
          git config user.name github-actions
          git config user.email actions@github.com
          git push -f origin HEAD:refs/heads/ci-report || true
          git checkout -B ci-report
          git add -f unit-test-report.log
          git commit -m "test report ${{ github.sha }}" || true
          git push -f origin ci-report || true

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
