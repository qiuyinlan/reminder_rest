name: Android Build

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Read version info
        id: version
        run: |
          VERSION_NAME=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle | head -1)
          VERSION_CODE=$(grep -oP "versionCode\s+\K[0-9]+" app/build.gradle | head -1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME ($VERSION_CODE)"

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Publish failure log
        if: steps.build.outcome == 'failure'
        run: |
          tail -c 30000 /tmp/build.log > ci-failure.log
          git config user.name github-actions
          git config user.email actions@github.com
          git push -f origin HEAD:refs/heads/ci-log || true
          git checkout -B ci-log
          git add -f ci-failure.log
          git commit -m "ci: build failure log for ${{ github.sha }}"
          git push -f origin ci-log

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Rename APK
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p artifacts
          SRC=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          DEST="artifacts/HealthReminder-${{ steps.version.outputs.name }}-debug.apk"
          cp "$SRC" "$DEST"
          ls -lh artifacts
          echo "sha256:"
          sha256sum "$DEST"

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: HealthReminder-${{ steps.version.outputs.name }}-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90
