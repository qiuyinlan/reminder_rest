name: Smoke Test
on:
  push:
    branches: ['smoke/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run smoke test
        run: |
          gradle :app:testDebugUnitTest --tests 'io.iftech.healthreminder.StatsSmokeTest' --no-daemon --stacktrace 2>&1 | tee /tmp/smoke.log
      - name: Publish failure log
        if: failure()
        run: |
          tail -c 60000 /tmp/smoke.log > smoke-failure.log
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout -B smoke-log
          git add -f smoke-failure.log
          git commit -m "smoke failure for ${{ github.sha }}"
          git push -f origin smoke-log
