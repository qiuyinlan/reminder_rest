plugins {
    id 'com.android.application'
}

def localSigningProperties = new Properties()
def localSigningFile = rootProject.file('local.properties')
if (localSigningFile.exists()) {
    localSigningFile.withInputStream { localSigningProperties.load(it) }
}
def signingValue = { String name ->
    providers.gradleProperty(name)
            .orElse(providers.environmentVariable(name))
            .orElse(localSigningProperties.getProperty(name, ''))
            .get()
}

def appVersionName = providers.gradleProperty('versionName')
        .orElse(providers.environmentVariable('APP_VERSION_NAME'))
        .orElse('0.1.7').get()
def appVersionCode = providers.gradleProperty('versionCode')
        .orElse(providers.environmentVariable('APP_VERSION_CODE'))
        .orElse('8').get().toInteger()

android {
    namespace 'io.iftech.healthreminder'
    compileSdk 35

    defaultConfig {
        applicationId 'io.iftech.healthreminder'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField 'String', 'MEMBERSHIP_API_BASE_URL', '"' + (providers.gradleProperty('membershipApiBaseUrl').orElse(providers.environmentVariable('MEMBERSHIP_API_BASE_URL').orElse('')).get().replace('\\', '\\\\').replace('"', '\\"')) + '"'
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', '"' + (providers.gradleProperty('updateManifestUrl').orElse(providers.environmentVariable('UPDATE_MANIFEST_URL').orElse('https://raw.githubusercontent.com/qiuyinlan/reminder_rest/main/update-manifest.json')).get().replace('\\', '\\\\').replace('"', '\\"')) + '"'
    }

    signingConfigs {
        release {
            def storePath = signingValue('RELEASE_STORE_FILE')
            if (storePath?.trim()) {
                storeFile file(storePath.trim())
                storePassword signingValue('RELEASE_STORE_PASSWORD')
                keyAlias signingValue('RELEASE_KEY_ALIAS')
                keyPassword signingValue('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.16.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
